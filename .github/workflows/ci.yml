name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck devops.sh lib/*.sh modules/*/*/module.sh tests/*.sh packaging/*.sh
      - name: smoke test
        run: tests/smoke.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: the macOS Bash 3.2 gets a clear message
        run: |
          out=$(/bin/bash ./devops.sh --version 2>&1) && exit 1
          echo "$out"
          grep -q 'needs Bash 4' <<< "$out"
      - name: Bash 4+ and jq from Homebrew
        run: brew install bash jq
      - name: smoke test
        timeout-minutes: 15
        run: PS4='+ ${BASH_SOURCE##*/}:${LINENO} ' $(brew --prefix)/bin/bash -x tests/smoke.sh 2> "$RUNNER_TEMP/trace.log"
      - name: last lines of the trace
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/trace.log"

  windows:
    runs-on: windows-latest
    steps:
      # Windows runners check out with core.autocrlf=true, like most Windows
      # machines; .gitattributes must keep the scripts LF.
      - uses: actions/checkout@v4
      - name: smoke test (Git Bash)
        shell: bash
        run: tests/smoke.sh
      - name: devops.bat finds Git Bash
        shell: cmd
        run: devops.bat --version
