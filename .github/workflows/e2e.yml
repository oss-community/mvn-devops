name: e2e

# Starts the real tools in Docker, runs the pipeline of examples/hello-maven
# with each orchestrator and checks the results in the tools (tests/e2e.sh).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  schedule:
    # Weekly, to catch changes in the tools' latest images.
    - cron: '0 3 * * 1'

jobs:
  e2e:
    name: ${{ matrix.orchestrator }} (${{ matrix.with }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - orchestrator: maven
            with: sonarqube,nexus
          # Setup only: Artifactory OSS repositories need its Quick Setup wizard.
          - orchestrator: maven
            with: jfrog
          - orchestrator: jenkins
            with: sonarqube,nexus
          - orchestrator: concourse
            with: sonarqube,nexus
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        # SonarQube does not start on a disk that is more than 90% full.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: tests/e2e.sh ${{ matrix.orchestrator }} ${{ matrix.with }}
        run: tests/e2e.sh ${{ matrix.orchestrator }} ${{ matrix.with }}
