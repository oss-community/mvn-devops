name: e2e

# Starts the real tools in Docker, runs the whole pipeline of an example
# project with each complete ready-made pipeline (pipelines/*-complete.conf)
# and checks the results in the tools (tests/e2e.sh).  tests/e2e.sh also runs
# any other combination by hand.
# Every night at 04:00 UTC, and by hand (Actions > e2e > Run workflow); the
# smoke test (ci.yml) runs on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  e2e:
    name: ${{ matrix.orchestrator }} (${{ matrix.with }})${{ matrix.environments && format(' [{0}]', matrix.environments) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - orchestrator: pipeline
            with: maven-complete
          - orchestrator: pipeline
            with: jenkins-complete
          - orchestrator: pipeline
            with: concourse-complete
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        # SonarQube does not start on a disk that is more than 90% full.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: tests/e2e.sh ${{ matrix.orchestrator }} ${{ matrix.with }}
        run: tests/e2e.sh ${{ matrix.orchestrator }} ${{ matrix.with }}
        env:
          # Two environments: one deployed by the pipeline, one after the approval.
          E2E_ENVIRONMENTS: staging prod
