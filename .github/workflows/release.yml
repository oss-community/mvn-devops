name: release

# Push a tag such as v0.1.0, or run the workflow by hand with a version, to
# build the packages and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (the tag v<version> is created)'
        required: true

permissions:
  contents: write

env:
  NFPM_VERSION: 2.43.0
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check the tag
        run: |
          # An old tag with the same name would make the release point to old code.
          if sha=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Tag $TAG already exists on $sha. Delete it first."; exit 1; }
          fi
      - name: shellcheck
        run: shellcheck devops.sh lib/*.sh modules/*/*/module.sh tests/*.sh packaging/*.sh
      - name: smoke test
        run: tests/smoke.sh
      - name: install nfpm
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - name: build packages
        run: packaging/build.sh "$TAG"
      - name: check the deb package
        run: |
          sudo apt-get install -y -qq --no-install-recommends ./dist/*.deb > /dev/null
          [ "$(mvn-devops --version)" = "${TAG#v}" ]
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "mvn-devops $TAG" --generate-notes
