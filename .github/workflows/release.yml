name: release

# Push a tag such as v0.1.0 to build the packages and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NFPM_VERSION: 2.43.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck devops.sh lib/*.sh modules/*/*/module.sh tests/*.sh packaging/*.sh
      - name: smoke test
        run: tests/smoke.sh
      - name: install nfpm
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - name: build packages
        run: packaging/build.sh "${GITHUB_REF_NAME}"
      - name: check the deb package
        run: |
          sudo apt-get install -y -qq --no-install-recommends ./dist/*.deb > /dev/null
          [ "$(mvn-devops --version)" = "${GITHUB_REF_NAME#v}" ]
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "mvn-devops ${GITHUB_REF_NAME}" --generate-notes
