spring.application.name=hello-data
# DEPLOY_ENVIRONMENT is set by the deployment (staging, production).
app.environment=${DEPLOY_ENVIRONMENT:local}
# The deployment sets SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD; these
# defaults are a PostgreSQL on this machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/hello_data
spring.datasource.username=hello_data
spring.datasource.password=hello_data
# Flyway applies db/migration at startup.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
