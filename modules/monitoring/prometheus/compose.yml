# Prometheus scrapes the application in each environment; Grafana shows it.
# Their configuration is written by "devops.sh up" to .devops/monitoring.
services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.15.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # k6 (loadtest/k6) writes the metrics of its load tests.
      - --web.enable-remote-write-receiver
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ${DEVOPS_STATE}/monitoring/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-13.2.3}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/application.json
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ${DEVOPS_STATE}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${DEVOPS_STATE}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
