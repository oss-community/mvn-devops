services:
  jenkins:
    build:
      context: ${DEVOPS_HOME}/modules/orchestrator/jenkins/docker
      args:
        JAVA_VERSION: ${JAVA_VERSION:-21}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9}
    image: mvn-devops/jenkins:maven${MAVEN_VERSION:-3.9}-jdk${JAVA_VERSION:-21}
    restart: unless-stopped
    env_file:
      - ${DEVOPS_STATE}/env/pipeline.env
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
    ports:
      - "${JENKINS_HOST_PORT}:8080"
    # Deployed applications publish their ports on this machine (load test).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - jenkins-home:/var/jenkins_home
      - ${DEVOPS_STATE}/generated/jenkins:/var/jenkins_home/casc_configs:ro

volumes:
  jenkins-home:
