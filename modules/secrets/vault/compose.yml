# Vault with its data in a volume.  It starts sealed; configure initialises
# it once and unseals it (the unseal key and root token stay in .devops).
services:
  vault:
    image: hashicorp/vault:${VAULT_IMAGE_TAG:-1.21.4}
    command: server
    restart: unless-stopped
    environment:
      VAULT_LOCAL_CONFIG: >-
        {"storage": {"file": {"path": "/vault/file"}},
        "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
        "ui": true, "disable_mlock": true, "api_addr": "http://127.0.0.1:8200"}
    ports:
      - "${VAULT_HOST_PORT}:8200"
    volumes:
      - vault-data:/vault/file

volumes:
  vault-data:
