# Concourse and GitOps with Argo CD: dev, test, staging and prod in git, secrets in Vault, prod as a canary.
ORCHESTRATOR=concourse
TOOLS=docker-registry,argocd,vault,sealed-secrets
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
GITOPS_CANARY=yes
