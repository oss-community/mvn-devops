# Concourse: an image with an SBOM, scanned and signed, deployed with Docker Compose and PostgreSQL to dev, staging and prod.
ORCHESTRATOR=concourse
TOOLS=docker-registry,docker-host,trivy,syft,cosign,postgresql
ENVIRONMENTS=dev staging prod
ENV_DEV_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
