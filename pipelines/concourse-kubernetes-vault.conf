# Concourse and SonarQube; an image deployed with Helm and PostgreSQL to dev, test, staging and prod, secrets in Vault, approvals before staging and prod.
ORCHESTRATOR=concourse
TOOLS=sonarqube,docker-registry,kubernetes,vault,postgresql
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=yes
ENV_PROD_APPROVAL=yes
