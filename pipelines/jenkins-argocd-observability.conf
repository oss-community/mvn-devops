# Jenkins and Argo CD: dev, test, staging and prod from git, load tested in staging, with metrics and logs.
ORCHESTRATOR=jenkins
TOOLS=docker-registry,argocd,prometheus,loki,k6
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
LOAD_TEST_ENVIRONMENT=staging
GITOPS_CANARY=no
