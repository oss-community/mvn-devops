# Jenkins with every kind of tool: SonarQube, Nexus, a scanned and signed image, Argo CD with Vault, PostgreSQL, metrics, logs and a load test.
ORCHESTRATOR=jenkins
TOOLS=sonarqube,nexus,docker-registry,trivy,syft,cosign,argocd,vault,postgresql,prometheus,loki,k6
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
LOAD_TEST_ENVIRONMENT=staging
GITOPS_CANARY=no
