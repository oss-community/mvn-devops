# Jenkins with SonarQube and Nexus; an image scanned, signed and deployed with Helm to dev, test, staging and prod.
ORCHESTRATOR=jenkins
TOOLS=sonarqube,nexus,docker-registry,kubernetes,trivy,syft,cosign
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
