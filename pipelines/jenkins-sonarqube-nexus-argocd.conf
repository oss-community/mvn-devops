# Jenkins, SonarQube and Nexus; an image in a local registry, deployed by Argo CD from git to dev, test, staging and prod.
ORCHESTRATOR=jenkins
TOOLS=sonarqube,nexus,docker-registry,argocd
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
GITOPS_CANARY=no
