# Maven in a container on the Docker machine with every tool: SonarQube, Nexus, a scanned and signed image, Argo CD with Vault, PostgreSQL, metrics, logs and a load test.
ORCHESTRATOR=maven-container
TOOLS=sonarqube,nexus,docker-registry,trivy,syft,cosign,argocd,vault,sealed-secrets,postgresql,prometheus,loki,k6
ENVIRONMENTS=dev test staging prod
ENV_DEV_APPROVAL=no
ENV_TEST_APPROVAL=no
ENV_STAGING_APPROVAL=no
ENV_PROD_APPROVAL=yes
LOAD_TEST_ENVIRONMENT=staging
GITOPS_CANARY=yes
