{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.canary.enabled }}
  # Canary: abort and go back to the stable version when the new pods are not
  # ready within the deadline.
  progressDeadlineSeconds: 180
  progressDeadlineAbort: true
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
  {{- else }}
  # Rolling update: a new pod must be ready before an old one goes.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        # New pods when the secrets change.
        checksum/env: {{ list .Values.secretEnv .Values.sealedSecretEnv | toJson | sha256sum }}
    spec:
      {{- if .Values.registryAuth }}
      imagePullSecrets:
        - name: {{ .Release.Name }}-registry
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: DEPLOY_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # Secrets of the environment: from the values, or managed outside the
          # chart.  Pods wait for the secret when the values have it.
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
                optional: {{ not (or .Values.secretEnv .Values.sealedSecretEnv) }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Liveness starts once the application has started (up to 5 minutes).
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- if .Values.shutdownDelay }}
          # A pod that is stopped keeps serving while the service stops
          # sending it new connections, so a release drops no requests.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.shutdownDelay }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
