{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.canary.enabled }}
  # Canary: abort and go back to the stable version when the new pods are not
  # ready within the deadline.
  progressDeadlineSeconds: 180
  progressDeadlineAbort: true
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
  {{- else }}
  # Rolling update: a new pod must be ready before an old one goes.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      {{- if .Values.registryAuth }}
      imagePullSecrets:
        - name: {{ .Release.Name }}-registry
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: DEPLOY_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # Settings and secrets of the environment, managed outside the chart.
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
                optional: true
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Liveness starts once the application has started (up to 5 minutes).
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
