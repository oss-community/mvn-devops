{{- if .Values.sealedSecretEnv }}
# The environment's secrets, encrypted for the Sealed Secrets controller of
# the cluster, which turns them into the Secret below.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecretEnv | nindent 4 }}
  template:
    metadata:
      name: {{ .Release.Name }}-env
      labels:
        {{- include "app.labels" . | nindent 8 }}
{{- else if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
